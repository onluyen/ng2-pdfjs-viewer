<div class="pdfjs-container">
	<div #loadingSpin class="loadingSpin">
		<div class="loader"></div>
	</div>

	<div class="iframe-container" #iframeDocx>
		<div class="toolbar">
			<div id="toolbarContainer">
				<div id="toolbarViewer">
					<button id="download" (click)="downloadFile()" class="toolbarButton download" title="Download" tabindex="34" data-l10n-id="download">
						<img src="/assets/pdfjs/web/images/toolbarButton-download.png" alt="Download" />
					</button>

					<button *ngIf="closeButton" id="closeFile" (click)="closeWordFile()" class="toolbarButton" title="Close" tabindex="36" data-l10n-id="closeFile">
						<img src="/assets/pdfjs/web/images/close-file.png" alt="Close" />
					</button>
				</div>
			</div>
		</div>

		<div #docxRenderContainer id="docxRenderContainer" style="height: calc(100% - 32px); overflow: auto; background: #fff; display: none; padding: 20px;"></div>
		<div #pptxFallbackContainer id="pptxFallbackContainer" style="height: calc(100% - 32px); display: none; overflow: auto; background: #525659; align-items: flex-start; justify-content: center;"></div>
		<iframe id="iframeDocx" title="ng2-pdfjs-viewer" [hidden]="externalWindow || (!externalWindow && !pdfSrc)" width="100%"></iframe>
	</div>

	<iframe id="iframePDF" #iframePDF title="ng2-pdfjs-viewer" [hidden]="externalWindow || (!externalWindow && !pdfSrc)" width="100%" height="100%"></iframe>
</div>
